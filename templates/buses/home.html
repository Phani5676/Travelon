{% extends "base.html" %}

{% block content %}
  <h1 class="mb-1">Book your bus seat</h1>
  <p class="text-muted mb-4">Search buses, pick your exact seat, and travel.</p>

  <form method="get" action="/search/" class="card card-body shadow-sm">
    <div class="row g-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label" for="from">From</label>
        <input class="form-control" id="from" name="from" list="cities" placeholder="Delhi" required>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="to">To</label>
        <input class="form-control" id="to" name="to" list="cities" placeholder="Jaipur" required>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="date">Travel date</label>
        <input class="form-control" type="date" id="date" name="date" value="{{ today }}" min="{{ today }}" required>
      </div>
      <div class="col-md-3">
        <button class="btn btn-warning w-100 fw-bold" type="submit">Search buses</button>
      </div>
    </div>

    <datalist id="cities">
      {% for city in cities %}<option value="{{ city }}">{% endfor %}
    </datalist>
  </form>
{% endblock %}
