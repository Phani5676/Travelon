<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BusGo - book bus seats{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'home' %}">BusGo</a>

      <div class="d-flex align-items-center gap-2">
        {% if user.is_authenticated %}
            <a class="btn btn-outline-light btn-sm" href="{% url 'my_bookings' %}">My bookings</a>
                      {% if user.operator %}
            <a class="btn btn-outline-light btn-sm" href="{% url 'operator_dashboard' %}">Operator</a>
          {% endif %}
          <span class="text-white">Hi, {{ user.username }}</span>
          <form method="post" action="{% url 'logout' %}" class="m-0">
            {% csrf_token %}
            <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
          </form>
        {% else %}
          <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Log in</a>
          <a class="btn btn-warning btn-sm fw-bold" href="{% url 'signup' %}">Sign up</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

</body>
</html>
